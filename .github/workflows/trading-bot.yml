name: Bot Trading Or XAUUSD

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests
      - name: Cycle du bot de trading
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
      - name: Sauvegarder l'etat du bot
        run: |
          git config user.name "Trading Bot"
          git config user.email "[actions@github.com](mailto:actions@github.com)"
          git add state.json trades.json
          if git diff --cached --quiet; then
            echo "Rien a commiter"
          else
            git commit -m "cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
