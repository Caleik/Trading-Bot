name: Bot Trading Or XAUUSD

on:
  schedule:
    # SECOURS uniquement : le cron GitHub throttle les workflows frequents (observed :
    # 0 a 2 declenchements/heures). La surveillance continue vient de l'auto-relance
    # en fin de run (chaine) + le watchdog Base44 qui rebranche si la chaine casse.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests
      - name: Cycle du bot (1 check ~30 s)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
      - name: Sauvegarder l'etat du bot
        if: always()   # commit l'etat meme si Discord a echoue (run rouge visible)
        run: |
          git config user.name "Trading Bot"
          git config user.email "actions@github.com"
          git add state.json trades.json
          if git diff --cached --quiet; then
            echo "Rien a commiter"
          else
            git commit -m "cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Relancer le prochain cycle (chaine continue ~60-90 s)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DISPATCHES=$(python3 -c "import json;print(json.load(open('state.json')).get('dispatches_today',0))" 2>/dev/null || echo 0)
          QUEUED=$(gh api "repos/Caleik/Trading-Bot/actions/workflows/trading-bot.yml/runs?status=queued&per_page=5" --jq 'length' 2>/dev/null || echo 1)
          echo "relances aujourd'hui: $DISPATCHES | runs en file: $QUEUED"
          if [ "$DISPATCHES" -lt 800 ] && [ "$QUEUED" -eq 0 ]; then
            gh api -X POST repos/Caleik/Trading-Bot/actions/workflows/trading-bot.yml/dispatches -f ref=main
            echo "prochain cycle relance"
          else
            echo "relance ignoree (cap journalier atteint ou run deja en file)"
          fi
