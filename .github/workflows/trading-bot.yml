name: Bot Trading Or XAUUSD

on:
  schedule:
    # Toutes les 15 minutes, avec un decalage de 3 min pour eviter les pics
    # de charge de GitHub (les tics a l'heure pile sont souvent retardes/annules).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 16   # 13 checks de 60 s (~13,5 min) + marge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests
      - name: Surveillance continue du bot (13 checks de 60 s)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
      - name: Sauvegarder l'etat du bot
        if: always()   # commit l'etat meme si Discord a echoue (run rouge visible)
        run: |
          git config user.name "Trading Bot"
          git config user.email "actions@github.com"
          git add state.json trades.json
          if git diff --cached --quiet; then
            echo "Rien a commiter"
          else
            git commit -m "cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
          fi
